<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Aria — Control Center</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: #14161a;
        color: #e8eaed;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 20px 48px;
        display: grid;
        gap: 16px;
      }
      .card {
        background: #1e2127;
        border: 1px solid #2c313a;
        border-radius: 10px;
        padding: 16px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 15px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #9aa4b2;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 12px;
        padding: 6px 0;
        border-bottom: 1px solid #262b33;
      }
      .row:last-child {
        border-bottom: none;
      }
      .row-label {
        color: #b9c0cb;
      }
      .row-value {
        font-variant-numeric: tabular-nums;
      }
      .control {
        gap: 8px;
      }
      .muted {
        color: #8b95a3;
        font-size: 13px;
      }
      .reason {
        flex-basis: 100%;
        margin: 2px 0 0;
      }
      button {
        background: #3b82f6;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        background: #3a3f48;
        color: #7c8592;
        cursor: not-allowed;
      }
      select {
        background: #262b33;
        color: #e8eaed;
        border: 1px solid #3a4048;
        border-radius: 6px;
        padding: 6px 8px;
        min-width: 200px;
      }
      select:disabled {
        color: #7c8592;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <main id="control-center">
      <h1>Aria — Control Center</h1>
    </main>
    <script defer src="./control-center.js"></script>
  </body>
</html>
