<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'"
    />
    <title>Aria</title>
    <link rel="stylesheet" href="./theme.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }

      #orb {
        position: relative;
        display: grid;
        place-items: center;
        height: 100%;
        background: transparent;
      }

      /* One glass sphere. The window is a transparent square; only this circle
         is ever painted, so nothing around it reads as a panel. */
      .orb {
        position: relative;
        display: grid;
        place-items: center;
        width: 208px;
        height: 208px;
        cursor: pointer;
        outline: none;
        --cue-hue: 262;
        --cue: hsl(var(--cue-hue) 88% 66%);
        --cue-soft: hsl(var(--cue-hue) 85% 60% / 0.34);
      }

      .glow,
      .ring,
      .orbit,
      .sphere,
      .core,
      .specular,
      .sheen,
      .label,
      .detail {
        pointer-events: none;
      }

      .glow {
        position: absolute;
        width: 176px;
        height: 176px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--cue-soft) 0%, rgba(0, 0, 0, 0) 66%);
        filter: blur(26px);
        animation: halo-breathe 5.5s ease-in-out infinite;
      }

      /* A conic sweep ring around the sphere: a quiet liveness cue. */
      .ring {
        position: absolute;
        width: 190px;
        height: 190px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          rgba(0, 0, 0, 0) 0deg,
          var(--cue-soft) 90deg,
          rgba(0, 0, 0, 0) 220deg,
          rgba(0, 0, 0, 0) 360deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        animation: ring-spin 7s linear infinite;
        opacity: 0.85;
      }

      .sphere {
        position: relative;
        width: 168px;
        height: 168px;
        border-radius: 50%;
        overflow: hidden;
        background:
          radial-gradient(circle at 68% 82%, rgba(130, 160, 255, 0.24) 0%, rgba(130, 160, 255, 0) 34%),
          radial-gradient(circle at 50% 50%, rgba(30, 35, 55, 0.9) 0%, rgba(12, 15, 26, 0.96) 62%, rgba(5, 6, 13, 1) 100%);
        box-shadow:
          inset 0 -20px 38px rgba(2, 3, 8, 0.9),
          inset 0 16px 28px rgba(255, 255, 255, 0.1),
          inset 0 0 0 1px rgba(190, 205, 255, 0.16),
          inset 0 0 34px -6px var(--cue-soft),
          0 30px 64px -26px rgba(0, 0, 0, 0.95);
        transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* The hot centre: a soft light that pulses with the voice. */
      .core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, var(--cue-soft) 40%, rgba(0, 0, 0, 0) 72%);
        mix-blend-mode: screen;
        animation: core-breathe 2.6s ease-in-out infinite;
      }

      .glass {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
      }

      .radial-surface {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
      }

      /* Without a WebGL context the radial face is painted with the theme's own
         conic gradient, so the sphere is never a flat disc. */
      .sphere.radial-fallback {
        background:
          radial-gradient(circle at 68% 82%, rgba(130, 160, 255, 0.24) 0%, rgba(130, 160, 255, 0) 34%),
          var(--radial-surface, radial-gradient(circle, #011b5e, #05060d));
        box-shadow:
          inset 0 -20px 38px rgba(2, 3, 8, 0.9),
          inset 0 16px 28px rgba(255, 255, 255, 0.1),
          inset 0 0 0 1px rgba(190, 205, 255, 0.16),
          inset 0 0 34px -6px var(--cue-soft),
          0 30px 64px -26px rgba(0, 0, 0, 0.95);
      }

      .specular {
        position: absolute;
        left: 14%;
        top: 8%;
        width: 46%;
        height: 46%;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 38%, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 68%);
        mix-blend-mode: screen;
      }

      /* A slow-moving sheen across the upper hemisphere reads as polished glass. */
      .sheen {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0) 42%, rgba(255, 255, 255, 0.22) 50%, rgba(255, 255, 255, 0) 58%);
        mix-blend-mode: screen;
        animation: sheen-sweep 6s ease-in-out infinite;
      }

      .orbit {
        position: absolute;
        inset: 0;
        animation: ring-spin 16s linear infinite;
      }

      .mote {
        position: absolute;
        left: 50%;
        top: 4px;
        width: 4px;
        height: 4px;
        margin-left: -2px;
        border-radius: 50%;
        background: var(--cue);
        box-shadow: 0 0 8px var(--cue);
        opacity: 0.85;
      }

      .mote:nth-child(2) {
        top: auto;
        bottom: 4px;
        left: 22%;
        opacity: 0.5;
      }

      .mote:nth-child(3) {
        top: 34%;
        left: auto;
        right: 2px;
        opacity: 0.7;
      }

      .label,
      .detail {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        text-align: center;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        white-space: nowrap;
      }

      .label {
        top: calc(50% + 96px);
        font-family: var(--font-body);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #e4e8ff;
      }

      .detail {
        top: calc(50% + 116px);
        max-width: 300px;
        font-size: 11px;
        color: #b9c0dd;
        white-space: normal;
      }

      /* --- interaction feedback ---------------------------------------- */

      .orb:hover .sphere,
      .orb:focus-visible .sphere {
        transform: scale(1.05);
      }

      .orb:focus-visible .ring {
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5);
      }

      .orb:active .sphere {
        transform: scale(0.97);
      }

      /* --- presence-driven motion -------------------------------------- */

      .orb[data-cue='pulse'] .sphere {
        animation: pulse-soft 1.6s ease-out infinite;
      }
      .orb[data-cue='pulse'] .core {
        animation-duration: 1.1s;
      }
      .orb[data-cue='waveform'] .sphere {
        animation: breathe 1.7s ease-in-out infinite;
      }
      .orb[data-cue='waveform'] .core {
        animation-duration: 0.9s;
      }
      .orb[data-cue='bars'] .sphere {
        animation: breathe 0.9s ease-in-out infinite;
      }
      .orb[data-cue='bars'] .core {
        animation-duration: 0.7s;
      }
      .orb[data-cue='gear'] .sphere {
        animation: breathe 3.6s ease-in-out infinite;
      }
      .orb[data-cue='halt'] .ring,
      .orb[data-cue='slash'] .ring {
        animation-play-state: paused;
        opacity: 0.3;
      }
      .orb[data-cue='alert'] .glow {
        animation-duration: 1.4s;
      }

      /* --- radial state motion ----------------------------------------- */

      /* The shader carries the heavy motion; these rules tune the surrounding
         ring and halo so the whole presence, not just the face, reads as busy. */
      .orb[data-orb-ui-state='listening'] .ring {
        animation-duration: 3.2s;
        opacity: 1;
      }
      .orb[data-orb-ui-state='speaking'] .ring {
        animation-duration: 2.1s;
        opacity: 1;
      }
      .orb[data-orb-ui-state='thinking'] .ring {
        animation-duration: 4.6s;
      }
      .orb[data-orb-ui-state='connecting'] .ring {
        animation-duration: 1.6s;
        opacity: 0.95;
      }
      .orb[data-orb-ui-state='connecting'] .glow,
      .orb[data-orb-ui-state='error'] .glow {
        animation-duration: 1.4s;
      }

      @keyframes pulse-soft {
        0% {
          box-shadow:
            inset 0 -20px 38px rgba(2, 3, 8, 0.9),
            inset 0 16px 28px rgba(255, 255, 255, 0.1),
            inset 0 0 0 1px rgba(190, 205, 255, 0.16),
            inset 0 0 34px -6px var(--cue-soft),
            0 0 0 0 hsl(var(--cue-hue) 85% 62% / 0.5);
        }
        100% {
          box-shadow:
            inset 0 -20px 38px rgba(2, 3, 8, 0.9),
            inset 0 16px 28px rgba(255, 255, 255, 0.1),
            inset 0 0 0 1px rgba(190, 205, 255, 0.16),
            inset 0 0 34px -6px var(--cue-soft),
            0 0 0 26px hsl(var(--cue-hue) 85% 62% / 0);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.045);
        }
      }

      @keyframes halo-breathe {
        0%,
        100% {
          opacity: 0.82;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }

      @keyframes core-breathe {
        0%,
        100% {
          opacity: 0.7;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.18);
        }
      }

      @keyframes ring-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes sheen-sweep {
        0%,
        100% {
          transform: translateX(-18%);
          opacity: 0.5;
        }
        50% {
          transform: translateX(18%);
          opacity: 0.9;
        }
      }

      /* Respect a user who has asked the OS to reduce motion. */
      @media (prefers-reduced-motion: reduce) {
        .glow,
        .ring,
        .orbit,
        .core,
        .sheen,
        .sphere {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="orb"></main>
    <script defer src="./orb.js"></script>
  </body>
</html>
