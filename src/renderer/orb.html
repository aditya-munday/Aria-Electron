<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'"
    />
    <title>Aria</title>
    <link rel="stylesheet" href="./theme.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }

      #orb {
        position: relative;
        display: grid;
        place-items: center;
        height: 100%;
        background: transparent;
      }

      /* One glass sphere. The window is a transparent square; only this circle
         is ever painted, so nothing around it reads as a panel. */
      .orb {
        position: relative;
        display: grid;
        place-items: center;
        width: 208px;
        height: 208px;
        --cue-hue: 262;
        --cue: hsl(var(--cue-hue) 88% 66%);
        --cue-soft: hsl(var(--cue-hue) 85% 60% / 0.34);
      }

      .glow,
      .sphere,
      .specular {
        pointer-events: none;
      }

      .glow {
        position: absolute;
        width: 176px;
        height: 176px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--cue-soft) 0%, rgba(0, 0, 0, 0) 66%);
        filter: blur(26px);
        animation: halo-breathe 5.5s ease-in-out infinite;
      }

      .sphere {
        position: relative;
        width: 168px;
        height: 168px;
        border-radius: 50%;
        overflow: hidden;
        background:
          radial-gradient(circle at 68% 82%, rgba(130, 160, 255, 0.24) 0%, rgba(130, 160, 255, 0) 34%),
          radial-gradient(circle at 50% 50%, rgba(30, 35, 55, 0.9) 0%, rgba(12, 15, 26, 0.96) 62%, rgba(5, 6, 13, 1) 100%);
        box-shadow:
          inset 0 -20px 38px rgba(2, 3, 8, 0.9),
          inset 0 16px 28px rgba(255, 255, 255, 0.1),
          inset 0 0 0 1px rgba(190, 205, 255, 0.16),
          inset 0 0 34px -6px var(--cue-soft),
          0 30px 64px -26px rgba(0, 0, 0, 0.95);
      }

      .glass {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
      }

      /* Without a canvas context the ribbon is painted with a static CSS
         gradient band, so the sphere is never a flat disc. */
      .sphere.glass-fallback {
        background:
          linear-gradient(
            155deg,
            rgba(0, 0, 0, 0) 30%,
            hsl(var(--cue-hue) 92% 62% / 0.42) 44%,
            hsl(calc(var(--cue-hue) + 60) 92% 66% / 0.4) 50%,
            hsl(calc(var(--cue-hue) + 140) 92% 62% / 0.4) 56%,
            rgba(0, 0, 0, 0) 70%
          ),
          radial-gradient(circle at 50% 50%, rgba(30, 35, 55, 0.9) 0%, rgba(12, 15, 26, 0.96) 62%, rgba(5, 6, 13, 1) 100%);
      }

      .specular {
        position: absolute;
        left: 14%;
        top: 8%;
        width: 46%;
        height: 46%;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 38%, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 68%);
        mix-blend-mode: screen;
      }

      .label,
      .detail {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        text-align: center;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        white-space: nowrap;
      }

      .label {
        top: calc(50% + 96px);
        font-family: var(--font-body);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #e4e8ff;
      }

      .detail {
        top: calc(50% + 116px);
        max-width: 280px;
        font-size: 11px;
        color: #b9c0dd;
        white-space: normal;
      }

      .orb[data-cue='pulse'] .sphere {
        animation: pulse-soft 1.6s ease-out infinite;
      }
      .orb[data-cue='waveform'] .sphere {
        animation: breathe 1.7s ease-in-out infinite;
      }
      .orb[data-cue='gear'] .sphere {
        animation: breathe 3.6s ease-in-out infinite;
      }

      @keyframes pulse-soft {
        0% {
          box-shadow:
            inset 0 -20px 38px rgba(2, 3, 8, 0.9),
            inset 0 16px 28px rgba(255, 255, 255, 0.1),
            inset 0 0 0 1px rgba(190, 205, 255, 0.16),
            inset 0 0 34px -6px var(--cue-soft),
            0 0 0 0 hsl(var(--cue-hue) 85% 62% / 0.5);
        }
        100% {
          box-shadow:
            inset 0 -20px 38px rgba(2, 3, 8, 0.9),
            inset 0 16px 28px rgba(255, 255, 255, 0.1),
            inset 0 0 0 1px rgba(190, 205, 255, 0.16),
            inset 0 0 34px -6px var(--cue-soft),
            0 0 0 26px hsl(var(--cue-hue) 85% 62% / 0);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.045);
        }
      }

      @keyframes halo-breathe {
        0%,
        100% {
          opacity: 0.82;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }
    </style>
  </head>
  <body>
    <main id="orb"></main>
    <script defer src="./orb.js"></script>
  </body>
</html>
