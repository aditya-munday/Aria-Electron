<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Aria — Orb</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #orb {
        height: 100%;
        display: grid;
        place-items: center;
        color: #e8eaed;
        -webkit-app-region: no-drag;
      }
      .orb {
        display: grid;
        place-items: center;
        gap: 8px;
        text-align: center;
      }
      .cue {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 2px solid #4b5563;
        box-sizing: border-box;
      }
      .label {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #cdd3dc;
      }
      .detail {
        margin: 0;
        max-width: 280px;
        font-size: 11px;
        color: #9aa4b2;
      }

      .orb[data-cue="dot"] .cue {
        background: radial-gradient(circle at center, #6b7280 0 18%, transparent 20%);
      }
      .orb[data-cue="waveform"] .cue {
        border-radius: 12px;
        border-color: #3b82f6;
        background: repeating-linear-gradient(
          90deg,
          #3b82f6 0 4px,
          transparent 4px 10px
        );
      }
      .orb[data-cue="pulse"] .cue {
        border-color: #a855f7;
        box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.6);
        animation: pulse 1.4s ease-out infinite;
      }
      .orb[data-cue="bars"] .cue {
        border: none;
        border-radius: 0;
        background: repeating-linear-gradient(
          90deg,
          #22c55e 0 6px,
          transparent 6px 14px
        );
      }
      .orb[data-cue="alert"] .cue {
        border-color: #ef4444;
        background: linear-gradient(135deg, transparent 42%, #ef4444 42% 58%, transparent 58%);
      }
      .orb[data-cue="slash"] .cue {
        border-color: #6b7280;
        background: linear-gradient(135deg, transparent 46%, #9aa4b2 46% 54%, transparent 54%);
      }
      @keyframes pulse {
        to {
          box-shadow: 0 0 0 24px rgba(168, 85, 247, 0);
        }
      }
    </style>
  </head>
  <body>
    <main id="orb"></main>
    <script defer src="./orb.js"></script>
  </body>
</html>
