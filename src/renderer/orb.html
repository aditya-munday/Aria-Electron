<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'"
    />
    <title>Aria</title>
    <link rel="stylesheet" href="./theme.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }

      #orb {
        position: relative;
        display: grid;
        place-items: center;
        height: 100%;
        background: transparent;
      }

      /* One soft sphere. Every layer is a circle with a radial falloff; there
         is no panel, frame or rectangular background anywhere. */
      .orb {
        position: relative;
        display: grid;
        place-items: center;
        width: 128px;
        height: 128px;
      }

      .halo,
      .glow,
      .core,
      .ring {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }

      .halo {
        width: 208px;
        height: 208px;
        background: radial-gradient(
          circle,
          rgba(124, 92, 255, 0.34) 0%,
          rgba(77, 124, 255, 0.18) 34%,
          rgba(52, 211, 238, 0.06) 56%,
          rgba(52, 211, 238, 0) 72%
        );
        filter: blur(18px);
        animation: halo-breathe 5.5s ease-in-out infinite;
      }

      .glow {
        width: 152px;
        height: 152px;
        background: radial-gradient(
          circle,
          rgba(180, 156, 255, 0.5) 0%,
          rgba(124, 92, 255, 0.26) 40%,
          rgba(124, 92, 255, 0) 70%
        );
        filter: blur(10px);
      }

      .ring {
        width: 128px;
        height: 128px;
        box-shadow: inset 0 0 0 1px rgba(214, 226, 255, 0.14);
      }

      /* The sphere: a highlight offset toward the light, a saturated mid, a
         deep shadow — a radial gradient with no hard edge, so nothing reads as
         a square inside a circle. */
      .core {
        width: 128px;
        height: 128px;
        background:
          radial-gradient(
            circle at 34% 28%,
            #f4f1ff 0%,
            #c9b8ff 12%,
            #8b6cff 34%,
            #5a3fd6 60%,
            #2b2170 84%,
            #191344 100%
          );
        box-shadow:
          inset 0 -10px 26px rgba(6, 4, 26, 0.55),
          inset 0 8px 20px rgba(255, 255, 255, 0.28),
          0 14px 40px -12px rgba(60, 34, 160, 0.9);
      }

      .label,
      .detail {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        text-align: center;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.75);
        white-space: nowrap;
      }

      .label {
        top: calc(50% + 78px);
        font-family: var(--font-body);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #e4e8ff;
      }

      .detail {
        top: calc(50% + 96px);
        max-width: 260px;
        font-size: 11px;
        color: #b9c0dd;
        white-space: normal;
      }

      .orb[data-cue='pulse'] .core {
        animation: pulse 1.5s ease-out infinite;
      }
      .orb[data-cue='waveform'] .core {
        animation: breathe 1.7s ease-in-out infinite;
      }

      .orb[data-cue='bars'] .core {
        background: radial-gradient(
          circle at 34% 28%,
          #eafff5 0%,
          #9df3cd 14%,
          #3ddc97 40%,
          #17936a 68%,
          #0b4634 100%
        );
        box-shadow:
          inset 0 -10px 26px rgba(2, 24, 16, 0.5),
          inset 0 8px 20px rgba(255, 255, 255, 0.3),
          0 14px 40px -12px rgba(24, 160, 110, 0.9);
      }

      .orb[data-cue='alert'] .core {
        background: radial-gradient(
          circle at 34% 28%,
          #fff0f0 0%,
          #ffb3b3 14%,
          #ff6b6b 42%,
          #b62b2b 70%,
          #4d0f0f 100%
        );
        box-shadow:
          inset 0 -10px 26px rgba(40, 4, 4, 0.55),
          inset 0 8px 20px rgba(255, 255, 255, 0.28),
          0 14px 40px -12px rgba(200, 40, 40, 0.9);
      }

      .orb[data-cue='slash'] .core {
        background: radial-gradient(
          circle at 34% 28%,
          #f3f4f8 0%,
          #c9cedb 14%,
          #8b93a5 44%,
          #4d5462 72%,
          #22262f 100%
        );
        box-shadow:
          inset 0 -10px 26px rgba(8, 10, 14, 0.55),
          inset 0 8px 20px rgba(255, 255, 255, 0.22),
          0 14px 40px -12px rgba(20, 24, 32, 0.85);
      }

      .orb[data-cue='slash'] .ring {
        background: linear-gradient(
          135deg,
          transparent 44%,
          rgba(255, 255, 255, 0.5) 50%,
          transparent 56%
        );
      }

      @keyframes pulse {
        0% {
          box-shadow:
            inset 0 -10px 26px rgba(6, 4, 26, 0.55),
            inset 0 8px 20px rgba(255, 255, 255, 0.28),
            0 0 0 0 rgba(147, 197, 253, 0.55);
        }
        100% {
          box-shadow:
            inset 0 -10px 26px rgba(6, 4, 26, 0.55),
            inset 0 8px 20px rgba(255, 255, 255, 0.28),
            0 0 0 30px rgba(147, 197, 253, 0);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes halo-breathe {
        0%,
        100% {
          opacity: 0.85;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }
    </style>
  </head>
  <body>
    <main id="orb"></main>
    <script defer src="./orb.js"></script>
  </body>
</html>
