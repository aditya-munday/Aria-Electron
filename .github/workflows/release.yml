name: release

on:
  push:
    tags:
      - 'aria-v*'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run ci

  package:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run pack:deb
      - run: npm run security:check
      - run: npm run verify:package
      - name: Locate package
        id: pkg
        run: |
          file=$(ls release/*.deb | sort -V | tail -n1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"
      - name: Smoke test the installed package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y "./${{ steps.pkg.outputs.file }}"
          sudo chmod 4755 /opt/Aria/chrome-sandbox
          node scripts/smoke-deb.mjs --no-install "${{ steps.pkg.outputs.file }}"
      - name: Checksum
        run: sha256sum "${{ steps.pkg.outputs.file }}" > "${{ steps.pkg.outputs.file }}.sha256"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Linux amd64 Debian package for the Aria desktop client.

            ## Install
            ```sh
            sudo apt install ./${{ steps.pkg.outputs.name }}
            ```
            `apt` (not a bare `dpkg -i`) resolves the declared runtime libraries
            and runs the postinst that sets up the sandbox helper.

            ## Verify the download
            A truncated or empty download shows as 0 B in some clients while the
            asset proxy resolves. Confirm the file against the attached checksum
            before installing:
            ```sh
            sha256sum -c ${{ steps.pkg.outputs.name }}.sha256
            ```

            This release was created by an AI agent (OpenHands) on behalf of the user.
          files: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.pkg.outputs.file }}.sha256
          fail_on_unmatched_files: true
