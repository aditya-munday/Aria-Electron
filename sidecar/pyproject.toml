[project]
name = "aria-voice"
version = "0.8.0"
description = "Aria local voice sidecar: openWakeWord wake detection and Silero VAD over a framed stdio protocol."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "openwakeword==0.4.0",
    "pydantic==2.14.1",
    "sounddevice==0.5.6",
    "soxr==1.1.0",
]

[project.scripts]
aria-voice = "aria_voice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]
build = [
    "pyinstaller==6.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aria_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "bench"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "openwakeword", "openwakeword.*", "soxr", "sounddevice"]
ignore_missing_imports = true
